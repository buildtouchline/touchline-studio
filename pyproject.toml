[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touchline-starter"
version = "0.1.0"
description = "Recorded football-video analytics starter with explicit evidence and dataset contracts"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
vision = ["av>=14,<18", "Pillow>=10,<13", "numpy>=1.24,<3"]
data = ["Pillow>=10,<13"]
tracking = ["supervision==0.26.0", "scipy>=1.10,<2"]
providers = ["openai>=1,<3", "modal>=1,<2"]

[project.scripts]
touchline = "touchline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
